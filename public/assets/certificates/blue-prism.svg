<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bp-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006699"/>
      <stop offset="50%" stop-color="#004B73"/>
      <stop offset="100%" stop-color="#002D45"/>
    </linearGradient>
    <linearGradient id="bp-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAFCFF"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </linearGradient>
    <filter id="bp-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#bp-bg)"/>
  
  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="752" height="512" rx="12" fill="none" stroke="#004B73" stroke-width="2.5"/>
  <rect x="34" y="34" width="732" height="492" rx="8" fill="none" stroke="#006699" stroke-width="1.2"/>

  <!-- Geometric Corner Flourishes -->
  <circle cx="48" cy="48" r="6" fill="#006699"/>
  <circle cx="752" cy="48" r="6" fill="#006699"/>
  <circle cx="48" cy="512" r="6" fill="#006699"/>
  <circle cx="752" cy="512" r="6" fill="#006699"/>

  <!-- Header / Issuer -->
  <g transform="translate(400, 85)" text-anchor="middle">
    <!-- Emblem -->
    <polygon points="-16,-12 0,-24 16,-12 16,12 0,24 -16,12" fill="#004B73"/>
    <text y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#004B73" letter-spacing="2">SS&amp;C BLUE PRISM</text>
    <text y="54" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#006699" letter-spacing="1.5">ENTERPRISE AUTOMATION &amp; WORKFLOW SYSTEMS</text>
  </g>

  <!-- Title of Award -->
  <g transform="translate(400, 180)" text-anchor="middle">
    <text y="0" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#555555" letter-spacing="2">This is to certify that</text>
    <text y="42" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#111111" letter-spacing="1">DHRUVRAJSINH RANA</text>
    <line x1="-190" y1="56" x2="190" y2="56" stroke="#004B73" stroke-width="1.5"/>
    <text y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#444444">has demonstrated competency and achieved official certification in</text>
    <text y="118" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#004B73" letter-spacing="0.5">PROCESS AUTOMATION &amp; SYSTEM LOGIC</text>
    <text y="142" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666">Process Flow Mapping • Logic Structuring • Interface Interaction Architecture</text>
  </g>

  <!-- Credential Details Footer -->
  <g transform="translate(80, 430)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#D0DCE5" stroke-width="1"/>
    <text x="16" y="24" font-family="monospace" font-size="9" font-weight="700" fill="#888888" letter-spacing="1">ISSUED DATE</text>
    <text x="16" y="44" font-family="monospace" font-size="13" font-weight="700" fill="#111111">JULY 2022</text>
  </g>

  <!-- Official Seal -->
  <g transform="translate(400, 455)">
    <circle cx="0" cy="0" r="38" fill="url(#bp-blue)" filter="url(#bp-shadow)"/>
    <circle cx="0" cy="0" r="32" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#004B73" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text y="-6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#004B73" letter-spacing="1">CERTIFIED</text>
    <text y="8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#111111">SS&amp;C</text>
    <text y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#004B73">BLUE PRISM</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(640, 450)" text-anchor="middle">
    <path d="M -50 -10 Q -25 -25 5 -10 T 55 -15" stroke="#111111" stroke-width="1.5" fill="none" opacity="0.8"/>
    <line x1="-70" y1="5" x2="70" y2="5" stroke="#999999" stroke-width="1"/>
    <text y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#555555" letter-spacing="1">GLOBAL PROGRAM HEAD</text>
    <text y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#888888">SS&amp;C BLUE PRISM</text>
  </g>
</svg>
