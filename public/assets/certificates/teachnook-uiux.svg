<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="tn-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#9E7618"/>
    </linearGradient>
    <linearGradient id="tn-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFA"/>
      <stop offset="100%" stop-color="#F4F3EE"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" rx="16" fill="url(#tn-bg)"/>
  
  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="752" height="512" rx="12" fill="none" stroke="#111111" stroke-width="2" stroke-opacity="0.85"/>
  <rect x="32" y="32" width="736" height="496" rx="8" fill="none" stroke="url(#tn-gold)" stroke-width="1.5"/>

  <!-- Corner Ornaments -->
  <path d="M 40 54 L 54 40 M 40 40 L 58 40 M 40 40 L 40 58" stroke="url(#tn-gold)" stroke-width="1.5" fill="none"/>
  <path d="M 760 54 L 746 40 M 760 40 L 742 40 M 760 40 L 760 58" stroke="url(#tn-gold)" stroke-width="1.5" fill="none"/>
  <path d="M 40 506 L 54 520 M 40 520 L 58 520 M 40 520 L 40 502" stroke="url(#tn-gold)" stroke-width="1.5" fill="none"/>
  <path d="M 760 506 L 746 520 M 760 520 L 742 520 M 760 520 L 760 502" stroke="url(#tn-gold)" stroke-width="1.5" fill="none"/>

  <!-- Header / Issuer -->
  <g transform="translate(400, 85)" text-anchor="middle">
    <!-- Issuer Badge Icon -->
    <circle cx="0" cy="0" r="22" fill="#111111"/>
    <path d="M -10 -4 L 0 -14 L 10 -4 L 6 12 L -6 12 Z" fill="#E5C158"/>
    <text y="38" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#E63946" letter-spacing="3">TEACHNOOK EDUCATIONAL CONSULTANT</text>
    <text y="54" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#666666" letter-spacing="1.5">PROFESSIONAL EDTECH CERTIFICATION DIVISION</text>
  </g>

  <!-- Title of Award -->
  <g transform="translate(400, 180)" text-anchor="middle">
    <text y="0" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#555555" letter-spacing="2">This is to certify that</text>
    <text y="42" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#111111" letter-spacing="1">DHRUVRAJSINH RANA</text>
    <line x1="-180" y1="56" x2="180" y2="56" stroke="#C59B27" stroke-width="1.5"/>
    <text y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#444444">has successfully completed the comprehensive certification in</text>
    <text y="118" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#E63946" letter-spacing="0.5">UI/UX DESIGN &amp; PRODUCT INTERFACES</text>
    <text y="142" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#666666" max-width="500">covering Design Thinking, Wireframing, Figma Component Architecture, and Usability Research</text>
  </g>

  <!-- Credential Details Footer -->
  <g transform="translate(80, 430)">
    <rect x="0" y="0" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#E0DFD8" stroke-width="1"/>
    <text x="16" y="24" font-family="monospace" font-size="9" font-weight="700" fill="#888888" letter-spacing="1">CREDENTIAL ID</text>
    <text x="16" y="44" font-family="monospace" font-size="13" font-weight="700" fill="#111111">TNINTC22-2961</text>
  </g>

  <!-- Official Seal -->
  <g transform="translate(400, 455)">
    <circle cx="0" cy="0" r="38" fill="url(#tn-gold)" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="32" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="url(#tn-gold)" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text y="-6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#9E7618" letter-spacing="1">VERIFIED</text>
    <text y="8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" fill="#111111">2023</text>
    <text y="18" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#9E7618">MARCH</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(640, 450)" text-anchor="middle">
    <path d="M -60 -10 Q -30 -30 0 -10 T 50 -15" stroke="#111111" stroke-width="1.5" fill="none" opacity="0.8"/>
    <line x1="-70" y1="5" x2="70" y2="5" stroke="#999999" stroke-width="1"/>
    <text y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#555555" letter-spacing="1">DIRECTOR OF TRAINING</text>
    <text y="32" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#888888">TEACHNOOK CONSULTANT</text>
  </g>
</svg>
